services:
  # API service
  api:
    build: .
    container_name: research-assistant-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - research-assistant-network
  
  postgres:
    image: postgres:18-alpine
    container_name: research-assistant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research-assistant_db}
      POSTGRES_USER: ${POSTGRES_USER:-research-assistant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research-assistant_password}
      POSTGRES_HOST_AUTH_METHOD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - research-assistant-network

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: research-assistant-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - research-assistant-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    container_name: research-assistant-dashboards
    # Enhanced Discover experience (equivalent to opensearch_dashboards.yml settings)
    command:
      - opensearch-dashboards
      - --data_source.enabled=true
      - --workspace.enabled=true
      - --explore.enabled=true
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - research-assistant-network

volumes:
  postgres_data:
  opensearch_data:


networks:
  research-assistant-network:
    driver: bridge 